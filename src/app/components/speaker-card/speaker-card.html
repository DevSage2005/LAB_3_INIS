<article class="speaker-card">
  <div class="speaker-card__photo-wrap">
    <img class="speaker-card__photo" [src]="speaker.photoUrl" [alt]="speaker.name" />
  </div>
  <div class="speaker-card__body">
    <h3 class="speaker-card__name">{{ speaker.name }}</h3>
    <p class="speaker-card__topic">{{ speaker.topic }}</p>
  </div>
</article>
